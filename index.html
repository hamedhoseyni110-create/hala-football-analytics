<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e0c">
<meta name="color-scheme" content="dark">
<meta name="description" content="Hala — static football analytics: standings, form, head-to-head and predictions for the top 5 European leagues + the Champions League, 2026/27.">
<title>Hala — Football Analytics</title>
<link rel="preload" href="assets/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <div class="hero-glow" aria-hidden="true"></div>
  <div class="header-inner">
    <div class="brand-block">
      <h1 class="brand">Hala</h1>
      <p class="tagline" id="brand-tagline"></p>
    </div>
    <div class="header-controls">
      <div class="lang-toggle" id="lang-toggle" role="group" aria-label="Language">
        <span class="lang-pill" id="lang-pill" aria-hidden="true"></span>
      </div>
      <span class="data-badge" id="data-badge"></span>
    </div>
  </div>
</header>

<main>

  <section id="hero" class="reveal hero" aria-labelledby="hero-h">
    <h2 id="hero-h" class="hero-title"></h2>
    <p class="hero-sub" id="hero-sub"></p>
    <div class="hero-ctas">
      <a class="cta" id="cta-compare" href="#compare-section"></a>
      <a class="cta ghost" id="cta-fixtures" href="#fixtures-section"></a>
    </div>
    <p class="hero-fast" id="hero-fast"></p>
  </section>

  <section id="compare-section" class="reveal" data-d="1" aria-labelledby="compare-h">
    <h2 id="compare-h"></h2>
    <p class="section-note" id="compare-sub"></p>
    <div class="cmp-controls">
      <div class="field">
        <label id="label-cmp-a" for="cmp-a"></label>
        <select id="cmp-a"></select>
      </div>
      <div class="vs-badge" id="cmp-vs" aria-hidden="true"></div>
      <div class="field">
        <label id="label-cmp-b" for="cmp-b"></label>
        <select id="cmp-b"></select>
      </div>
    </div>
    <p class="cmp-hint" id="cmp-empty"></p>
    <p class="error" id="cmp-error" hidden></p>
    <div class="cmp-panels" id="cmp-panels" hidden></div>
    <div class="chips-key-wrap" id="cmp-chipkey"></div>
    <div class="cmp-recent" id="cmp-recent" hidden></div>
  </section>

  <section id="fixtures-section" class="reveal" data-d="2" aria-labelledby="fixtures-h">
    <h2 id="fixtures-h"></h2>
    <p class="section-note" id="fixtures-sub"></p>
    <p class="tz-note" id="fixtures-tz"></p>
    <div class="league-tabs" role="tablist" id="fixture-tabs"></div>
    <ul class="fixtures" id="fixtures-list"></ul>
    <p class="fixtures-empty" id="fixtures-empty" hidden></p>
  </section>

  <section id="standings-section" class="reveal" aria-labelledby="standings-h">
    <h2 id="standings-h"></h2>
    <div class="league-tabs" role="tablist" id="league-tabs"></div>
    <div class="table-wrap">
      <table id="standings-table">
        <thead><tr id="standings-head"></tr></thead>
        <tbody id="standings-body"></tbody>
      </table>
    </div>
    <div class="legend" id="standings-legend"></div>
    <p class="section-note" id="standings-note"></p>
    <p class="fresh-note" id="standings-fresh"></p>
  </section>

  <section id="pro-section" class="reveal" data-d="1" aria-labelledby="pro-h">
    <h2 id="pro-h"><span class="pro-badge" id="pro-badge"></span> <span id="pro-title"></span></h2>
    <p class="section-note" id="pro-note"></p>

    <div class="card" id="h2h-card">
      <h3 id="h2h-h"></h3>
      <p class="chart-note" id="h2h-sub"></p>
      <div class="h2h-controls">
        <div class="field">
          <label id="label-h2h-a" for="h2h-a"></label>
          <select id="h2h-a"></select>
        </div>
        <div class="field">
          <label id="label-h2h-b" for="h2h-b"></label>
          <select id="h2h-b"></select>
        </div>
      </div>
      <p class="error" id="h2h-error" hidden></p>
      <div id="h2h-result" hidden>
        <div class="h2h-panels">
          <div class="sub-card">
            <h4 id="h2h-meetings-h"></h4>
            <ul class="meetings" id="h2h-meetings"></ul>
            <dl class="stat-grid" id="h2h-stats"></dl>
          </div>
          <div class="sub-card">
            <h4 id="h2h-form-h"></h4>
            <div class="form-row"><span id="form-a-name"></span><span class="form-chips" id="form-a"></span></div>
            <div class="form-row"><span id="form-b-name"></span><span class="form-chips" id="form-b"></span></div>
            <h4 id="h2h-pred-h"></h4>
            <div id="pred-bars"></div>
            <details class="method" id="method-details">
              <summary id="method-summary"></summary>
              <div class="method-body" id="method-body"></div>
            </details>
          </div>
        </div>
      </div>
    </div>

    <div class="chart-wrap tilt">
      <h3 id="trend-h"></h3>
      <p class="chart-note" id="trend-note"></p>
      <div class="chart-controls" id="trend-toggles"></div>
      <div id="trend-chart"></div>
      <div class="chart-legend" id="trend-legend"></div>
    </div>

    <div class="chart-wrap tilt">
      <h3 id="gfga-h"></h3>
      <p class="chart-note" id="gfga-note"></p>
      <div id="gfga-chart"></div>
      <div class="chart-legend" id="gfga-legend"></div>
    </div>
  </section>

</main>

<footer>
  <p id="footer-text"></p>
  <p id="footer-data"></p>
  <p id="footer-fresh"></p>
</footer>

<noscript>
  <div class="noscript">
    <p><strong>Hala</strong> — Football, made simple · كرة القدم، ببساطة · فوتبال، ساده و رو</p>
    <p>This page needs JavaScript to render the tables and charts. / برای نمایش جدول‌ها و نمودارها جاوااسکریپت لازم است.</p>
  </div>
</noscript>

<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
/* Hala v2 — motion layer. Independent of app.js: adds classes and inline
   transforms only, never touches app state. Bails out entirely under
   prefers-reduced-motion; without JS the page is fully visible and static.
   Zero external requests. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  var finePointer = window.matchMedia('(pointer: fine)').matches;
  document.documentElement.classList.add('js-motion');

  /* scroll reveals (staggered via data-d) */
  var io = new IntersectionObserver(function (entries) {
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].isIntersecting) {
        entries[i].target.classList.add('in');
        io.unobserve(entries[i].target);
      }
    }
  }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' });
  var reveals = document.querySelectorAll('.reveal');
  for (var i = 0; i < reveals.length; i++) io.observe(reveals[i]);

  /* hero parallax — scroll-scrubbed, transform-only, rAF-throttled */
  var glow = document.querySelector('.hero-glow');
  var ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      var y = window.scrollY || window.pageYOffset;
      if (glow && y < 500) {
        glow.style.transform = 'translate3d(0,' + (y * 0.22).toFixed(1) + 'px,0)';
      }
    });
  }
  if (glow) window.addEventListener('scroll', onScroll, { passive: true });

  /* subtle 3D tilt on chart cards — fine pointers only */
  if (finePointer) {
    var cards = document.querySelectorAll('.tilt');
    for (var c = 0; c < cards.length; c++) {
      (function (card) {
        var raf = 0, lastX = 0, lastY = 0;
        card.addEventListener('pointermove', function (ev) {
          lastX = ev.clientX; lastY = ev.clientY;
          if (raf) return;
          raf = requestAnimationFrame(function () {
            raf = 0;
            var r = card.getBoundingClientRect();
            var x = (lastX - r.left) / r.width - 0.5;
            var y = (lastY - r.top) / r.height - 0.5;
            card.style.transform =
              'perspective(1000px) rotateX(' + (-y * 3.5).toFixed(2) +
              'deg) rotateY(' + (x * 4.5).toFixed(2) + 'deg)';
          });
        });
        card.addEventListener('pointerleave', function () { card.style.transform = ''; });
      })(cards[c]);
    }
  }
})();
</script>
</body>
</html>
